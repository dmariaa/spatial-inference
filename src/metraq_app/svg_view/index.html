<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: system-ui, sans-serif;
            font-size: 12px;
            width: 100vh;
            height: 100vh;
        }

        .metraq-native-map {
            width: 100%
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1;
            background: white
        }

        .metraq-cell:hover, .metraq-cell:focus {
            stroke: #111;
            stroke-width: 2;
            outline: none
        }

        .metraq-scale {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            font-size: 11px
        }

        .metraq-scale > div {
            flex: 1;
            height: 10px;
            border-radius: 3px
        }

        .metraq-attribution {
            font-size: 10px;
            text-align: right;
            margin-top: 4px
        }

        a {
            color: inherit
        }
    </style>
</head>
<body>
<main id="map"></main>
<script>
    const send = (type, fields = {}) => window.parent.postMessage({isStreamlitMessage: true, type, ...fields}, '*');
    let lastHeight = 0;
    const resize = () => {
        const height = Math.ceil(document.body.getBoundingClientRect().height);
        if (height !== lastHeight) {
            lastHeight = height;
            send('streamlit:setFrameHeight', {height});
        }
    };
    window.addEventListener('message', event => {
        if (event.data.type !== 'streamlit:render') return;
        document.body.style.color = event.data.theme?.textColor || '#555';
        document.getElementById('map').innerHTML = event.data.args.markup;
        requestAnimationFrame(resize);
    });
    new ResizeObserver(resize).observe(document.body);
    send('streamlit:componentReady', {apiVersion: 1});
</script>
</body>
</html>
