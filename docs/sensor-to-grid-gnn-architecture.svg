<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sensor-to-Grid spatio-temporal graph neural network</title>
  <desc id="desc">Twenty-four hours of air-quality observations, availability masks, cyclical time features and node positions are encoded by a GRU and positional encoder. Learned global GATv2 attention propagates observed sensor information to every grid cell, followed by local grid refinement and a regression head that estimates the NO2 field.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Arial, Helvetica, sans-serif; fill: #475569; }
      .section { font: 700 19px Arial, Helvetica, sans-serif; fill: #334155; letter-spacing: 1px; }
      .block-title { font: 700 22px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .label { font: 400 17px Arial, Helvetica, sans-serif; fill: #334155; }
      .small { font: 400 15px Arial, Helvetica, sans-serif; fill: #475569; }
      .tiny { font: 400 13px Arial, Helvetica, sans-serif; fill: #64748b; }
      .math { font: italic 17px Georgia, serif; fill: #334155; }
      .box { stroke-width: 2; rx: 18; filter: url(#shadow); }
      .arrow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .blue-arrow { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrowBlue); }
      .thin { fill: none; stroke: #94a3b8; stroke-width: 1.5; }
      .grid { fill: none; stroke: #94a3b8; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="52" text-anchor="middle" class="title">Sensor-to-Grid Spatio-Temporal GNN</text>
  <text x="800" y="82" text-anchor="middle" class="subtitle">Global learned sensor influence followed by local spatial refinement</text>

  <text x="62" y="132" class="section">INPUT</text>
  <text x="438" y="132" class="section">ENCODING</text>
  <text x="780" y="132" class="section">GLOBAL PROPAGATION</text>
  <text x="1177" y="132" class="section">LOCAL REFINEMENT</text>
  <text x="1465" y="132" class="section">OUTPUT</text>

  <!-- Input observations -->
  <rect x="45" y="165" width="310" height="470" rx="18" fill="#eff6ff" stroke="#60a5fa" class="box"/>
  <text x="200" y="202" text-anchor="middle" class="block-title">24 h input window</text>
  <text x="200" y="230" text-anchor="middle" class="math">X ∈ ℝ B×N×24×6</text>

  <!-- mini time-series -->
  <line x1="78" y1="312" x2="315" y2="312" class="thin"/>
  <line x1="78" y1="260" x2="78" y2="312" class="thin"/>
  <polyline points="80,293 100,282 120,288 140,270 160,278 180,252 200,265 220,247 240,274 260,259 280,285 305,267" fill="none" stroke="#2563eb" stroke-width="4"/>
  <circle cx="80" cy="293" r="4" fill="#2563eb"/><circle cx="120" cy="288" r="4" fill="#2563eb"/><circle cx="160" cy="278" r="4" fill="#2563eb"/><circle cx="200" cy="265" r="4" fill="#2563eb"/><circle cx="240" cy="274" r="4" fill="#2563eb"/><circle cx="280" cy="285" r="4" fill="#2563eb"/>
  <text x="196" y="337" text-anchor="middle" class="small">NO₂ observations at source sensors</text>

  <rect x="78" y="365" width="238" height="54" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="197" y="388" text-anchor="middle" class="label">Availability mask</text>
  <text x="197" y="408" text-anchor="middle" class="tiny">observed / missing value indicator</text>

  <rect x="78" y="435" width="238" height="68" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="197" y="460" text-anchor="middle" class="label">Cyclical time features</text>
  <text x="197" y="483" text-anchor="middle" class="tiny">sin/cos hour · sin/cos day-of-year</text>

  <rect x="78" y="520" width="238" height="78" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="197" y="546" text-anchor="middle" class="label">Grid-node coordinates</text>
  <text x="197" y="570" text-anchor="middle" class="math">pᵢ = (xᵢ, yᵢ)</text>
  <text x="197" y="591" text-anchor="middle" class="tiny">1 km Euclidean grid</text>

  <!-- Encoders -->
  <rect x="430" y="190" width="270" height="175" rx="18" fill="#f5f3ff" stroke="#8b5cf6" class="box"/>
  <text x="565" y="232" text-anchor="middle" class="block-title">Temporal encoder</text>
  <rect x="475" y="254" width="180" height="60" rx="12" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
  <text x="565" y="291" text-anchor="middle" class="block-title">GRU</text>
  <text x="565" y="337" text-anchor="middle" class="math">hᵢ = Wₜ GRU(Xᵢ)</text>
  <text x="565" y="359" text-anchor="middle" class="tiny">temporal state: (B·N) × 32</text>

  <rect x="430" y="430" width="270" height="155" rx="18" fill="#f5f3ff" stroke="#8b5cf6" class="box"/>
  <text x="565" y="472" text-anchor="middle" class="block-title">Position encoder</text>
  <text x="565" y="508" text-anchor="middle" class="label">MLP (2 → 32 → 32)</text>
  <text x="565" y="542" text-anchor="middle" class="math">qᵢ = hᵢ + MLP(pᵢ)</text>
  <text x="565" y="566" text-anchor="middle" class="tiny">p: (B·N) × 2  →  q: (B·N) × 32</text>

  <path d="M355 300 C390 300 397 277 430 277" class="arrow"/>
  <path d="M355 557 C390 557 397 507 430 507" class="arrow"/>
  <path d="M565 365 L565 430" class="arrow"/>

  <!-- Global attention -->
  <rect x="770" y="165" width="335" height="470" rx="18" fill="#fff7ed" stroke="#f59e0b" class="box"/>
  <text x="938" y="205" text-anchor="middle" class="block-title">Global sensor→grid attention</text>
  <text x="938" y="234" text-anchor="middle" class="label">GATv2 · 4 attention heads</text>

  <!-- source sensors -->
  <circle cx="825" cy="292" r="15" fill="#2563eb"/><circle cx="825" cy="366" r="15" fill="#2563eb"/><circle cx="825" cy="440" r="15" fill="#2563eb"/>
  <text x="805" y="272" text-anchor="middle" class="tiny">source sensors</text>

  <!-- target grid -->
  <g transform="translate(946 273)">
    <rect x="0" y="0" width="112" height="224" rx="6" fill="#ffffff" stroke="#fbbf24" stroke-width="2"/>
    <path d="M28 0V224 M56 0V224 M84 0V224 M0 28H112 M0 56H112 M0 84H112 M0 112H112 M0 140H112 M0 168H112 M0 196H112" class="grid"/>
    <circle cx="14" cy="42" r="6" fill="#f59e0b"/><circle cx="70" cy="98" r="6" fill="#f59e0b"/><circle cx="42" cy="182" r="6" fill="#f59e0b"/><circle cx="98" cy="154" r="6" fill="#f59e0b"/>
  </g>

  <!-- dense influence edges -->
  <path d="M840 292 C885 292 905 302 960 315" stroke="#2563eb" stroke-width="3.5" opacity="0.85" fill="none"/>
  <path d="M840 292 C895 320 915 365 1016 427" stroke="#2563eb" stroke-width="1.5" opacity="0.35" fill="none"/>
  <path d="M840 366 C890 360 915 370 1016 371" stroke="#2563eb" stroke-width="2.7" opacity="0.65" fill="none"/>
  <path d="M840 366 C905 400 925 430 988 455" stroke="#2563eb" stroke-width="1.3" opacity="0.3" fill="none"/>
  <path d="M840 440 C895 440 920 438 988 455" stroke="#2563eb" stroke-width="3.8" opacity="0.9" fill="none"/>
  <path d="M840 440 C900 420 925 395 960 315" stroke="#2563eb" stroke-width="1.7" opacity="0.4" fill="none"/>

  <text x="938" y="535" text-anchor="middle" class="small">Every visible sensor connects to every grid cell</text>
  <text x="938" y="562" text-anchor="middle" class="math">αᵢ⟶ⱼ = GATv2(qᵢ, qⱼ, eᵢⱼ)</text>
  <text x="938" y="586" text-anchor="middle" class="tiny">edge index: 2 × E<tspan baseline-shift="sub">g</tspan> · edge attributes: E<tspan baseline-shift="sub">g</tspan> × 4</text>
  <text x="938" y="609" text-anchor="middle" class="tiny">global state: (B·N) × 32</text>
  <path d="M700 505 C730 505 735 400 770 400" class="arrow"/>

  <!-- Local refinement -->
  <rect x="1170" y="220" width="245" height="335" rx="18" fill="#ecfdf5" stroke="#10b981" class="box"/>
  <text x="1292" y="260" text-anchor="middle" class="block-title">Local grid refinement</text>
  <text x="1292" y="288" text-anchor="middle" class="label">1 × GATv2 layer</text>
  <g transform="translate(1210 316)">
    <circle cx="20" cy="20" r="8" fill="#10b981"/><circle cx="82" cy="20" r="8" fill="#10b981"/><circle cx="144" cy="20" r="8" fill="#10b981"/>
    <circle cx="20" cy="82" r="8" fill="#10b981"/><circle cx="82" cy="82" r="10" fill="#059669"/><circle cx="144" cy="82" r="8" fill="#10b981"/>
    <circle cx="20" cy="144" r="8" fill="#10b981"/><circle cx="82" cy="144" r="8" fill="#10b981"/><circle cx="144" cy="144" r="8" fill="#10b981"/>
    <path d="M20 20H82H144 M20 82H82H144 M20 144H82H144 M20 20V82V144 M82 20V82V144 M144 20V82V144" stroke="#34d399" stroke-width="3" fill="none"/>
  </g>
  <text x="1292" y="495" text-anchor="middle" class="small">Neighbour-to-neighbour smoothing</text>
  <text x="1292" y="515" text-anchor="middle" class="tiny">local edges: 2 × E<tspan baseline-shift="sub">l</tspan> · attributes: E<tspan baseline-shift="sub">l</tspan> × 4</text>
  <text x="1292" y="535" text-anchor="middle" class="tiny">output state: (B·N) × 32</text>
  <path d="M1105 400 L1170 400" class="arrow"/>

  <!-- Output -->
  <rect x="1450" y="250" width="125" height="250" rx="18" fill="#fef2f2" stroke="#ef4444" class="box"/>
  <text x="1512" y="285" text-anchor="middle" class="block-title">MLP</text>
  <text x="1512" y="310" text-anchor="middle" class="tiny">32 → 16 → 1</text>
  <g transform="translate(1472 340)">
    <rect x="0" y="0" width="80" height="112" rx="5" fill="#ffffff" stroke="#f87171" stroke-width="2"/>
    <rect x="7" y="73" width="10" height="32" fill="#fecaca"/><rect x="21" y="54" width="10" height="51" fill="#fca5a5"/><rect x="35" y="22" width="10" height="83" fill="#ef4444"/><rect x="49" y="43" width="10" height="62" fill="#f87171"/><rect x="63" y="65" width="10" height="40" fill="#fca5a5"/>
  </g>
  <text x="1512" y="477" text-anchor="middle" class="small">NO₂ field</text>
  <text x="1512" y="498" text-anchor="middle" class="tiny">Ŷ: (B·N) × 1</text>
  <path d="M1415 400 L1450 400" class="arrow"/>

  <!-- Residual / normalization band -->
  <rect x="430" y="690" width="985" height="100" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="922" y="718" text-anchor="middle" class="label">Tensor notation: B batch · N grid nodes · T=24 hours · H=32 hidden channels</text>
  <text x="922" y="746" text-anchor="middle" class="small">Input channels C=6: NO₂ value, availability, sin/cos hour, sin/cos day-of-year</text>
  <text x="922" y="770" text-anchor="middle" class="tiny">Residual connections · ELU · LayerNorm · Dropout (0.1) · masked MAE at held-out sensors</text>

  <!-- phase labels -->
  <text x="200" y="668" text-anchor="middle" class="tiny">Observed AQ is exposed only at context sensors</text>
  <text x="1512" y="535" text-anchor="middle" class="tiny">one value per node</text>
</svg>
